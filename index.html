<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>House of Kutch – GST Bill</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f4f6f9;--card:#fff;--tx:#1b2430;--mut:#667085;--bd:#d0d7e2;--pri:#1f4e78;--inp:#fffbe0;--ok:#e3f1d8}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161c;--card:#1b222b;--tx:#e8edf3;--mut:#9aa6b6;--bd:#33404f;--pri:#5b9bd5;--inp:#2a2a17;--ok:#20301a}}
:root[data-theme="dark"]{--bg:#12161c;--card:#1b222b;--tx:#e8edf3;--mut:#9aa6b6;--bd:#33404f;--pri:#5b9bd5;--inp:#2a2a17;--ok:#20301a}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Arial,Helvetica,sans-serif;font-size:15px}
.wrap{max-width:900px;margin:0 auto;padding:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px;margin-bottom:12px}
h1{margin:0 0 2px;font-size:20px;color:var(--pri)}h2{margin:0 0 10px;font-size:16px}
.sub{color:var(--mut);font-size:12px}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1 1 140px}
label{display:block;font-size:12px;color:var(--mut);margin-bottom:3px}
input{width:100%;padding:9px;border:1px solid var(--bd);border-radius:6px;background:var(--inp);color:var(--tx);font-size:15px}
.items{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:760px}
th,td{border:1px solid var(--bd);padding:5px 6px;font-size:13px;text-align:right}
th{background:var(--pri);color:#fff;text-align:center}
td:nth-child(2){text-align:left}
td input{padding:6px;font-size:14px}
.btn{border:0;border-radius:7px;padding:10px 14px;font-size:14px;font-weight:bold;cursor:pointer;background:var(--pri);color:#fff;flex:0 0 auto}
.btn.alt{background:transparent;color:var(--pri);border:1px solid var(--pri)}
.btn.red{background:#b3261e}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
#inv{background:#fff;color:#000;border:1px solid #999;padding:14px;max-width:760px;margin:0 auto;font-size:13px}
#inv h3{margin:0;text-align:center;font-size:22px;color:#1f4e78}
#inv .c{text-align:center}#inv table{min-width:0}
#inv th{background:#1f4e78;color:#fff}#inv td,#inv th{border:1px solid #444;color:#000}
#inv th{color:#fff}#inv tr.t td{background:#e3f1d8;font-weight:bold}
#inv .tt{background:#ddebf7;border:1px solid #444;text-align:center;font-weight:bold;margin:6px 0;padding:3px}
.hist td{text-align:left}.hist button{margin-right:4px}
@media print{
 body{background:#fff}.wrap{padding:0;max-width:none}
 .no-print{display:none!important}
 .card.pv{border:0;padding:0;margin:0}#inv{border:0;max-width:none}
 *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<div class="wrap">
<div class="card no-print">
 <h1>House of Kutch – GST Bill</h1>
</div>

<div class="card no-print">
 <h2>Bill details</h2>
 <div class="row">
  <div><label>Bill No</label><input id="bno" type="number" min="1"></div>
  <div><label>Date</label><input id="dt" type="date"></div>
  <div style="flex:2 1 220px"><label>Customer Name</label><input id="cn" placeholder="Customer name"></div>
  <div><label>Mobile (optional)</label><input id="cm" inputmode="numeric" placeholder="Mobile no."></div>
 </div>
</div>

<div class="card no-print">
 <h2>Items</h2>
 <div class="items"><table id="it">
  <thead><tr><th>#</th><th>Item</th><th style="width:70px">Qty</th><th style="width:110px">MRP</th><th style="width:80px">Disc %</th><th>SGST 2.5%</th><th>CGST 2.5%</th><th>Total</th><th></th></tr></thead>
  <tbody></tbody>
 </table></div>
 <div class="bar">
  <button class="btn alt" id="add">+ Add Item</button>
 </div>
</div>

<div class="card pv">
 <div id="inv"></div>
 <div class="bar no-print" style="justify-content:center">
  <button class="btn" id="prn">🖨 Print Bill</button>
  <button class="btn" id="sav">💾 Save Bill</button>
  <button class="btn alt" id="dlb">Download Bill File</button>
  <button class="btn alt" id="new">New Bill</button>
 </div>
 <div class="sub no-print" id="msg" style="text-align:center;margin-top:8px"></div>
</div>

<div class="card no-print">
 <h2>Saved bills</h2>
 <div class="items"><table class="hist" id="hist"><thead><tr><th>Bill No</th><th>Date</th><th>Customer</th><th>Total</th><th></th></tr></thead><tbody></tbody></table></div>
 <div class="bar"><button class="btn alt" id="csv">Save All Bills CSV</button><button class="btn alt" id="xls">Save All Bills Excel (.xlsx)</button></div>
 <div class="sub" id="msg2" style="margin-top:6px"></div>
 <textarea id="manual" readonly style="display:none;margin-top:8px;height:140px;font-size:12px"></textarea>
 <div class="bar"><button class="btn" id="cpy" style="display:none">Copy table (paste into Excel)</button></div>
</div>
</div>

var items=[{n:"",q:1,m:""}];
function $(i){return document.getElementById(i)}
function load(){try{return JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){return []}}
function store(b){try{localStorage.setItem(KEY,JSON.stringify(b));return true}catch(e){return false}}
function f2(x){return x.toLocaleString("en-IN",{minimumFractionDigits:2,maximumFractionDigits:2})}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function calc(m,q){
 var x=m*100/105,fl=Math.floor(x),fr=Math.round((x-fl)*100)/100;
 var t=(fr>=0.6?fl+1:fl)*q, tot=m*q, g=(tot-t)/2;
 return {t:t,s:g,c:g,tot:tot};
}
function ymd(d){return d.toISOString().slice(0,10)}
function dmy(s){if(!s)return"";var p=s.split("-");return p[2]+"-"+p[1]+"-"+p[0]}
function nextNo(){var b=load(),mx=0;b.forEach(function(x){if(+x.no>mx)mx=+x.no});return mx+1}

function rows(){
 var tb=document.querySelector("#it tbody");tb.innerHTML="";
 items.forEach(function(it,i){
  var tr=document.createElement("tr");
  tr.innerHTML='<td>'+(i+1)+'</td><td><input data-i="'+i+'" data-k="n" value="'+esc(it.n)+'" placeholder="Item name"></td>'+
  '<td><input data-i="'+i+'" data-k="q" type="number" min="1" value="'+it.q+'"></td>'+
  '<td><input data-i="'+i+'" data-k="m" type="number" min="0" step="any" inputmode="decimal" value="'+it.m+'" placeholder="MRP"></td>'+
  '<td><input data-i="'+i+'" data-k="d" type="number" min="0" max="100" step="any" inputmode="decimal" value="'+(it.d===undefined?"":it.d)+'" placeholder="0"></td>'+
  '<td id="s'+i+'"></td><td id="c'+i+'"></td><td id="a'+i+'"></td>'+
  '<td><button class="btn red" data-d="'+i+'" style="padding:4px 8px">✕</button></td>';
  tb.appendChild(tr);
 });
 upd();
}
function upd(){
 var T={t:0,s:0,c:0,tot:0,q:0},lines="";
 items.forEach(function(it,i){
  var m0=parseFloat(it.m),q=parseFloat(it.q)||0,d=Math.min(100,Math.max(0,parseFloat(it.d)||0));
  var m=Math.round(m0*(1-d/100)*100)/100;
  var ok=!isNaN(m0)&&q>0, r=ok?calc(m,q):null;
  [["s","s"],["c","c"],["a","tot"]].forEach(function(p){var e=$(p[0]+i);if(e)e.textContent=r?f2(r[p[1]]):""});
  if(r){T.t+=r.t;T.s+=r.s;T.c+=r.c;T.tot+=r.tot;T.q+=q;
   lines+='<tr><td style="text-align:center">'+(i+1)+'</td><td style="text-align:left">'+esc(it.n)+'</td><td style="text-align:center">'+q+'</td><td style="text-align:right">'+f2(m0)+'</td><td style="text-align:center">'+(d?d+"%":"-")+'</td><td style="text-align:right">'+f2(r.s)+'</td><td style="text-align:right">'+f2(r.c)+'</td><td style="text-align:right">'+f2(r.tot)+'</td></tr>';}
 });
 var cust=$("cn").value.trim(),mob=$("cm").value.trim();
 $("inv").innerHTML='<div style="display:flex;align-items:center;gap:12px"><img src="'+LOGO+'" alt="House of Kutch" style="width:90px;height:90px;object-fit:contain"><div style="flex:1"><h3>'+SHOP.n+'</h3><div class="c">'+SHOP.a+'</div><div class="c"><b>GSTIN: '+SHOP.g+'</b></div></div></div><div class="tt">TAX INVOICE</div>'+
 '<table style="border:0;margin-bottom:6px"><tr><td style="border:0;text-align:left"><b>Bill No:</b> '+esc($("bno").value)+'</td><td style="border:0;text-align:right"><b>Date:</b> '+dmy($("dt").value)+'</td></tr>'+
 '<tr><td style="border:0;text-align:left" colspan="2"><b>Customer:</b> '+esc(cust)+(mob?' &nbsp; <b>Mobile:</b> '+esc(mob):'')+'</td></tr></table>'+
 '<table><thead><tr><th>S.No</th><th>Item</th><th>Qty</th><th>MRP</th><th>Disc %</th><th>SGST 2.5%</th><th>CGST 2.5%</th><th>Amount</th></tr></thead><tbody>'+lines+
 '<tr class="t"><td colspan="2" style="text-align:center">TOTAL</td><td style="text-align:center">'+T.q+'</td><td></td><td></td><td style="text-align:right">'+f2(T.s)+'</td><td style="text-align:right">'+f2(T.c)+'</td><td style="text-align:right">'+f2(T.tot)+'</td></tr></tbody></table>'+

 '<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-top:18px"><div style="font-size:12px;line-height:1.5"><b>Terms and Conditions :</b><br>*No Exchange, No Return.<br>*Payment Not Refundable.<br>*No Guarantee<br>*All Disputes Subject to Local Jurisdiction Only<br><b>Thanks For visiting.</b></div><b>For HOUSE OF KUTCH</b></div><div style="text-align:right;margin-top:26px;font-size:11px">Authorised Signatory</div>';
 return T;
}

 b.forEach(function(x){

  tr.innerHTML='<td>'+esc(x.no)+'</td><td>'+dmy(x.dt)+'</td><td>'+esc(x.cn)+'</td><td style="text-align:right">'+f2(x.tot)+'</td><td><button class="btn alt" data-o="'+x.no+'" style="padding:5px 9px">Open</button><button class="btn red" data-x="'+x.no+'" style="padding:5px 9px">Delete</button></td>';
  tb.appendChild(tr);
 });
}
function reset(){items=[{n:"",q:1,m:""}];$("bno").value=nextNo();$("dt").value=ymd(new Date());$("cn").value="";$("cm").value="";rows();say("")}

document.addEventListener("input",function(e){
 var t=e.target,i=t.getAttribute("data-i");
 if(i!==null){items[i][t.getAttribute("data-k")]=t.value}
 upd();
});
document.addEventListener("click",function(e){
 var t=e.target;
 if(t.getAttribute("data-d")!==null){var i=+t.getAttribute("data-d");items.splice(i,1);if(!items.length)items=[{n:"",q:1,m:""}];rows()}
 if(t.getAttribute("data-o")!==null){var n=t.getAttribute("data-o"),x=load().filter(function(b){return String(b.no)===n})[0];
  if(x){items=x.items;$("bno").value=x.no;$("dt").value=x.dt;$("cn").value=x.cn;$("cm").value=x.cm;rows();window.scrollTo(0,0);say("Bill "+x.no+" opened.")}}
 if(t.getAttribute("data-x")!==null){var n2=t.getAttribute("data-x");if(confirm("Delete bill "+n2+"?")){store(load().filter(function(b){return String(b.no)!==n2}));hist()}}
});
$("add").onclick=function(){items.push({n:"",q:1,m:""});rows()};
$("new").onclick=reset;
$("sav").onclick=function(){
 if(!valid()){say("Enter MRP and Qty for at least one item.");return}
 var s=snapshot(),b=load().filter(function(x){return String(x.no)!==String(s.no)});b.push(s);
 b.sort(function(a,c){return a.no-c.no});
 say(store(b)?"Bill "+s.no+" saved.":"Could not save (browser storage is blocked).");hist();
};
$("prn").onclick=function(){
 if(!valid()){say("Enter MRP and Qty for at least one item.");return}
 upd();try{window.print()}catch(e){say("Print did not open here. Use Download Bill File, open it and print from there.")}
};
function save(name,data,el,plain){
 function m(t){el.textContent=t}
 function manual(){
  try{var a=document.createElement("a"),u=URL.createObjectURL(new Blob([data]));a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();m("If the file did not download, copy the table below and paste it into Excel.")}
  catch(e){m("Download is blocked here. Copy the table below and paste it into Excel.")}
  if(plain){var t=$("manual");t.style.display="block";t.value=plain;$("cpy").style.display="inline-block"}
 }
 m("Preparing download...");
 var p=(typeof claude!=="undefined"&&claude.use)?claude.use("downloads"):Promise.resolve(null);
 return p.then(function(d){
  if(!d){manual();return}
  return d.save({filename:name,data:data}).then(function(){m("File saved.")}).catch(function(err){
   if(err&&err.code==="declined"){m("Download cancelled.")}else{manual()}
  });
 }).catch(function(){manual()});
}
$("dlb").onclick=function(){
 if(!valid()){say("Enter MRP and Qty for at least one item.");return}
 upd();
 var h='<!DOCTYPE html><html><head><meta charset="utf-8"><title>Bill '+esc($("bno").value)+'</title><style>body{font-family:Arial;margin:20px}table{border-collapse:collapse;width:100%}th,td{border:1px solid #444;padding:5px;font-size:13px}th{background:#1f4e78;color:#fff}h3{text-align:center;color:#1f4e78;font-size:22px;margin:0}.c{text-align:center}.t td{background:#e3f1d8;font-weight:bold}.tt{background:#ddebf7;border:1px solid #444;text-align:center;font-weight:bold;margin:6px 0;padding:3px}@media print{*{-webkit-print-color-adjust:exact;print-color-adjust:exact}}</style></head><body onload="window.print()">'+$("inv").innerHTML+'</body></html>';
 save("Bill_"+$("bno").value+".html",h,$("msg"));
};
function allRows(){
 var R=[["Date","Bill No","Customer","Mobile","Item","Qty","MRP","Disc %","SGST 2.5%","CGST 2.5%","Total"]];
 load().forEach(function(x){x.items.forEach(function(it){var m=parseFloat(it.m),n=parseFloat(it.q);if(!(m>0&&n>0))return;
  var d=Math.min(100,Math.max(0,parseFloat(it.d)||0)),r=calc(Math.round(m*(1-d/100)*100)/100,n);
  R.push([dmy(x.dt),x.no,x.cn,x.cm,it.n,n,m,d,r.s,r.c,r.tot])})});
 return R;
}
function r2(v){return typeof v==="number"?Math.round(v*100)/100:v}
function tsvOf(R){return R.map(function(r){return r.map(function(v){return String(r2(v)).replace(/[\t\r\n]+/g," ")}).join("\t")}).join("\n")}
$("csv").onclick=function(){
 var R=allRows();if(R.length<2){$("msg2").textContent="No saved bills yet. Save a bill first.";return}
 function q(v){return '"'+String(v).replace(/"/g,'""')+'"'}
 var csv="\ufeff"+R.map(function(r){return r.map(function(v){return typeof v==="number"?r2(v):q(v)}).join(",")}).join("\r\n");
 save("House_of_Kutch_Bills.csv",csv,$("msg2"),tsvOf(R));
};
$("xls").onclick=function(){
 var R=allRows();if(R.length<2){$("msg2").textContent="No saved bills yet. Save a bill first.";return}
 if(typeof XLSX==="undefined"){$("msg2").textContent="Excel library did not load. Use Save All Bills CSV instead.";return}
 var ws=XLSX.utils.aoa_to_sheet(R.map(function(r){return r.map(r2)}));
 ws["!cols"]=[12,8,20,14,24,6,10,8,12,10,10,12].map(function(w){return{wch:w}});
 var wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,"Bills");
 save("House_of_Kutch_Bills.xlsx",XLSX.write(wb,{bookType:"xlsx",type:"array"}),$("msg2"),tsvOf(R));
};
$("cpy").onclick=function(){var t=$("manual");t.select();var ok=false;try{ok=document.execCommand("copy")}catch(e){}
 $("msg2").textContent=ok?"Copied. Open Excel and paste.":"Press and hold the selected text to copy it."};
reset();hist();
</script>
